apiVersion: v1
kind: ConfigMap
metadata:
  name: locol-ai-config
  namespace: locol-ai
data:
  # Public base URL of your deployment (the Ingress host, https).
  # Used by the Web app to reach the API and to build Content Editor links.
  LOCOL_API_URL: "https://<YOUR_HOST>"
  LOCOL_WWW_URL: "https://<YOUR_HOST>"

  # Ports the three processes inside the pod listen on. The image carries these same
  # values as defaults, so these keys only need setting to move a service off one.
  # YAML can't read env vars, so changing one here also means changing the matching
  # containerPort in 03-deployment.yaml - the Service and Ingress reference those by
  # name, so they need no edit. Same class of cross-file invariant as the timeout
  # note below.
  LOCOL_BACKEND_PORT: "8000"
  LOCOL_WEB_PORT: "8501"
  LOCOL_SQLITE_WEB_PORT: "8080"

  # Seed config (channels/LLMs/prompt templates) is baked into the image at
  # /app/BackEnd/config and is read-only at runtime, so no extra volume is
  # needed. (To override it without rebuilding, mount a ConfigMap or PVC at a
  # path of your choice and point this variable there instead — see
  # docs/deploy-k8s.md.)
  LOCOL_CONFIG_LOCATION: "/app/BackEnd/config"

  # Mount points for the JWT key pairs and DB-encryption-key secrets (see
  # 03-deployment.yaml). /keys holds four files - a signing pair and an encryption
  # pair - not two; see docs/jwt.md.
  LOCOL_JWT_KEYS_LOCATION: "/keys"
  LOCOL_DB_ENCRYPTION_KEY_LOCATION: "/db-key"

  # Seconds the Web app waits on a request that triggers an LLM call
  # (brainstorming, content generation, voice analysis). Must stay below the
  # ingress proxy-read-timeout in 05-ingress.yaml - if nginx gives up first the
  # user sees an opaque 504 instead of the app's own timeout message, so raising
  # this means raising that too.
  LOCOL_LLM_REQUEST_TIMEOUT: "180"

  # Whether to route users through the Bifrost LLM gateway. When on, registration
  # provisions a Bifrost customer and virtual key for the new user and points their
  # default LLM at LOCOL_BIFROST_URL instead of straight at the provider. Set this
  # to "false" to keep using the provider key seeded from llm.yaml - no other key
  # needs changing. Note that turning it off only stops new provisioning: users
  # already provisioned keep routing through the gateway.
  #
  # Local runs set neither this nor LOCOL_BIFROST_URL, which resolves to off.
  LOCOL_BIFROST_ENABLED: "true"

  # Address of the Bifrost LLM gateway (see bifrost/k8s/). The short Service name
  # is enough: Bifrost runs in this same namespace. Required whenever the flag
  # above is on.
  #
  # A virtual key only carries an authorization scope, not provider credentials -
  # Bifrost itself must have a provider entry whose key references a value from
  # bifrost-secrets, or every provisioned user's LLM will fail on first use. The
  # Secret alone is not enough; see the Bifrost section of docs/deploy-k8s.md.
  LOCOL_BIFROST_URL: "http://bifrost:8080"

  # What a provisioned LLM is pointed at, in Bifrost's "<provider>/<model>" form.
  # This string is both what goes on the wire and what each user's virtual key is
  # scoped to allow, so the provider prefix is what decides which upstream serves
  # the call. Bifrost must also have a provider entry for the provider named here,
  # whose key references a value from bifrost-secrets and whose model allowlist
  # covers this model - otherwise every provisioned user's LLM fails on first use
  # with "no keys found for provider".
  # The BackEnd has no built-in default: unset this and provisioning is skipped.
  # Changing this only affects users who register afterwards: an existing user keeps
  # the model on their row, and their key stays scoped to it.
  LOCOL_BIFROST_DEFAULT_MODEL: "deepseek/deepseek-v4-flash"

  # Spend cap put on each virtual key at creation. The limit is in dollars; the
  # reset duration is one of 30s / 5m / 1h / 1d / 1w / 1M / 1Q. Clearing the limit
  # (or setting it to 0) creates uncapped keys. Changing these only affects users
  # who register afterwards - existing keys keep the budget they were created with,
  # which has to be changed in Bifrost.
  LOCOL_BIFROST_BUDGET_MAX_LIMIT: "5"
  LOCOL_BIFROST_BUDGET_RESET_DURATION: "1M"

  # Seconds to wait on each call to Bifrost's governance API during registration.
  # There are up to four, so this bounds how long a signup can hang if Bifrost is
  # unreachable. Default shown; uncomment to change.
  # LOCOL_BIFROST_TIMEOUT: "5"

  # Per-user ceilings on the API endpoints that reach an LLM provider, in
  # slowapi's "<count>/<period>" form. Defaults shown; uncomment to change.
  # The batch limit covers /api/generate-project-items, which makes one LLM call
  # per selected idea (capped at 25 per request by GenerateItemsRequest).
  # LOCOL_LLM_RATE_LIMIT: "20/minute"
  # LOCOL_LLM_BATCH_RATE_LIMIT: "5/minute"

  # Comma-separated origins allowed to call the API from a browser. Empty (the
  # default) means none, which is correct for this deployment: the ingress puts
  # the Content Editor at /www on the same host as /api, and the Web app calls
  # the API server-side where CORS does not apply. Only set this if you serve
  # the editor from a different origin than the API - i.e. if LOCOL_WWW_URL and
  # LOCOL_API_URL point at different hosts.
  #
  # 03-deployment.yaml reads this key as optional, so leaving it commented out is
  # fine; uncommenting it here is enough to take effect on the next rollout. Note
  # that widening it is a real security decision - docs/security-management.md
  # section 7 explains what an empty allowlist is currently holding up.
  # LOCOL_CORS_ALLOW_ORIGINS: ""
