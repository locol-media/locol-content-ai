// Dynamically adjust main container and prompt_window_scroll for flexible bottom resizing
function adjustMainHeight() {
  const main = document.querySelector('main');
  const nav = document.querySelector('nav');
  const navHeight = nav ? nav.offsetHeight : 0;
  const windowHeight = window.innerHeight;
  
  // Set main to fill remaining height
  main.style.height = `${windowHeight - navHeight}px`;
  main.style.minHeight = `${windowHeight - navHeight}px`;
  
  // Also set panel_main, panel_left, and panel_right heights
  const panelMain = document.getElementById('panel_main');
  const panelLeft = document.getElementById('panel_left');
  const panelRight = document.getElementById('panel_right');
  const locolPromptWindow = document.getElementById('locol_prompt_window');
  const locolPromptEditor = document.getElementById('prompt-editor');

  if (panelMain) {
    panelMain.style.height = `${windowHeight - navHeight}px`;
  }
  if (panelLeft) {
    panelLeft.style.height = `${windowHeight - navHeight}px`;
  }
  if (panelRight) {
    panelRight.style.height = `${windowHeight - navHeight}px`;
  }
  if (locolPromptWindow) {
    locolPromptWindow.style.height = `${windowHeight - navHeight}px`;
  }
  if (locolPromptEditor) {
    const rect = locolPromptEditor.getBoundingClientRect();
    const availableHeight = windowHeight - rect.top;
    locolPromptEditor.style.height = `${availableHeight}px`;
    locolPromptEditor.style.maxHeight = `${availableHeight - 100}px`;
    console.log(`Set Prompt Editor height to ${availableHeight}`)
  }
  // Calculate and set height for prompt_window_scroll
  const promptWindowScroll = document.getElementById('prompt_window_scroll');
  if (promptWindowScroll) {
    const rect = promptWindowScroll.getBoundingClientRect();
    const availableHeight = windowHeight - rect.top;
    promptWindowScroll.style.height = `${availableHeight}px`;
      console.log(`Set Prompt Window height to ${availableHeight}`)
  }
}

// Run on load and resize
window.addEventListener('load', adjustMainHeight);
window.addEventListener('resize', adjustMainHeight);

// Add observer to detect dynamic content changes
const observer = new MutationObserver(() => {
  setTimeout(adjustMainHeight, 100); // Small delay to ensure content is rendered
});

// Observe changes in the prompt editor and window areas
window.addEventListener('load', () => {
  const promptEditor = document.getElementById('prompt-editor');
  const promptWindow = document.getElementById('locol_prompt_window');
  
  if (promptEditor) {
    observer.observe(promptEditor, { childList: true, subtree: true });
  }
  if (promptWindow) {
    observer.observe(promptWindow, { childList: true, subtree: true });
  }
});

// Function to manually trigger height adjustment (call this after dynamic content loads)
window.refreshLayout = function() {
  adjustMainHeight();
};
</script> <script type="application/javascript" src="/www/includes/quill-editor-window.js?v=1786418264"></script> <script type="application/javascript" src="/www/includes/dynamic-dropdown-class.js?v=1786418264"></script> <script type="application/javascript" src="/www/includes/dynamic-dropdowns.js?v=1786418264"></script> <script type="application/javascript" src="/www/includes/intro.min.js?v=1786418264"></script> <script type="application/javascript" src="/www/includes/getting-started.js?v=1786418264"></script> <script type="application/javascript" src="/www/includes/dynamic-filter.js?v=1786418264"></script> <link rel="stylesheet" href="/www/includes/grid-master.css"> <link rel="stylesheet" href="/www/includes/prompt-window.css"> <link rel="stylesheet" href="/www/includes/dynamic-dropdowns.css"> <link rel="stylesheet" href="/www/includes/introjs.min.css"> <link rel="stylesheet" href="/www/includes/dynamic-filter.css"> </body></html>
