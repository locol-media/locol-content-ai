[pytest]
testpaths = tests
# The page objects import as `pages`/`config`, so this folder has to be on the
# path whichever directory pytest is invoked from.
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: read-only checks that the page objects still match the app
    llm: exercises a real AI call - slow, and needs an LLM configured
    writes: creates or changes data in the account under test
