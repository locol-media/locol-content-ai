# The image ends with `USER app` (UID 1000), so supervisord itself runs unprivileged.
# Two consequences are encoded below and should not be undone without also changing
# the Dockerfile: there is no `user=` directive (supervisord refuses to start with one
# when it is not root - "can't drop privilege as nonroot user"), and the pidfile lives
# in /tmp rather than the root-owned /var/run. Logs all go to /dev/stdout and
# /dev/stderr, which any user can write to.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# The %(ENV_...)s port references below are expanded by supervisor at startup, and
# supervisord refuses to start at all if one is unset - the defaults that make them
# resolve are the ENV block in the Dockerfile, so the two files move together.
# Override any of them at run time (docker -e / the k8s ConfigMap) to change a port.

[program:web]
directory=/app/Web
command=uv run streamlit run src/main.py --server.port=%(ENV_LOCOL_WEB_PORT)s --server.address=0.0.0.0
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
directory=/app/BackEnd
command=uv run python src/main.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sqlite-web]
directory=/app
# Runs the module directly rather than `-m sqlite_web`: the package's __main__.py
# shim is broken upstream in 0.8.0 (see the pin in the Dockerfile). This form works
# on every version, so it stays correct if that pin is ever raised.
command=/usr/local/bin/python3 -m sqlite_web.sqlite_web /app/BackEnd/db/persistent_data.sqlite --host 0.0.0.0 --port %(ENV_LOCOL_SQLITE_WEB_PORT)s
environment=PYTHONPATH="/app/sqlite-web"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0