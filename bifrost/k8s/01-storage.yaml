# Persistent storage for Bifrost's own state (/app/data): the config database
# (config.db), the request log database (logs.db) and the optional semantic
# cache. Without it, every restart loses the provider configuration.
#
# ReadWriteOnce is sufficient because the Deployment runs a single replica
# (see 02-deployment.yaml).
#
# Set storageClassName to a block-storage class available in your cluster:
#   - Amazon EKS:      gp3   (requires the EBS CSI driver)
#   - DigitalOcean:    do-block-storage
#   - GKE:             standard-rwo / premium-rwo
#   - Local/kind/k3s:  standard  (or leave unset to use the cluster default)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-storage
  namespace: locol-ai
  labels:
    app: bifrost
spec:
  storageClassName: <RWO_STORAGE_CLASS>
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
